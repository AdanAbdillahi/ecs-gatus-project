name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config.yaml"
      - ".dockerignore"
      - "gatus"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config.yaml"
      - ".dockerignore"
      - "gatus"
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: 533267395439.dkr.ecr.eu-west-2.amazonaws.com/gatus-ecs-ecr
  ECS_CLUSTER: gatus-ecs-cluster
  ECS_SERVICE: gatus-ecs-service
  ECS_TASK_FAMILY: gatus-ecs-task
  CONTAINER_NAME: gatus

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build -t gatus:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gatus:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Configure AWS credentials via OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267395439:role/gatus-ecs-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        if: github.event_name != 'pull_request'
        run: |
          docker tag gatus:${{ github.sha }} $ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Get current task definition
        if: github.event_name != 'pull_request'
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY \
            --query taskDefinition > task-definition.json

      - name: Set new image in task definition
        if: github.event_name != 'pull_request'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy and wait for stability
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10